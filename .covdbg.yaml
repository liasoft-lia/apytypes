# Windows C++ coverage for run_coverage.yml (windows_msvc): the extension module
# (*_apytypes*.pyd), with the sources in this checkout, the same selection as before.
version: 1
source_root: "."
coverage:
  default:
    files:
      include:
        - "src/**"
        - "lib/**"
        - "subprojects/**"
        - "build/**"
    modules:
      include:
        - "*_apytypes*.pyd"
